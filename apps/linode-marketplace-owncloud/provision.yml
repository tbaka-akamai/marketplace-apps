# peppermint
- name: setting up environment 
  hosts: localhost
  connection: local
  any_errors_fatal: true
  user: root
  vars_files:
    - group_vars/linode/vars
  tasks:
  # generate creds
    - name: generating sudo user and password
      import_tasks: ../linode_helpers/roles/sudouser/tasks/main.yml
    
    - name: writing owncloud creds to vars
      blockinfile:
        insertafter: EOF
        path: group_vars/linode/vars
        block: |
          ocis_admin_password: {{ lookup('password', '/dev/null length=45 chars=ascii_letters,digits') }}
